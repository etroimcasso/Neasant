name: CI

# Triggers fire on ci/** only — not main, not pull_request. Finished work reaches
# main by squash-merge from a ci/<branch> that already ran this pipeline to green;
# re-running on the post-squash main rebuilds the same source for no new signal.
on:
  push:
    branches:
      - 'ci/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The oracle vectors (SingleStepTests 65x02, the nes6502 set) are never committed.
# Each job checks out only that directory of the repository once into the runner's
# home and reuses it warm on later runs. NEASANT_REQUIRE_NES6502_VECTORS turns an
# absent vector set into a hard failure, so a green run has provably executed the
# whole oracle rather than skipping it — the point of running on every architecture
# is to prove the interpreter produces identical results on each.

jobs:

  # ── Linux x64 (beefserve) ───────────────────────────────────────────────────
  linux-x64:
    name: Linux x64 (beefserve)
    runs-on: [self-hosted, Linux, X64, beefserve]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Stage nes6502 vectors
        run: |
          set -eo pipefail
          VECS="$HOME/neasant-65x02-vectors"
          if [ ! -d "$VECS/nes6502/v1" ]; then
            rm -rf "$VECS"
            git clone --depth 1 --filter=blob:none --sparse https://github.com/SingleStepTests/65x02.git "$VECS"
            git -C "$VECS" sparse-checkout set nes6502/v1
          fi
          echo "NES6502_VECTORS=$VECS/nes6502/v1" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNEASANT_NES6502_VECTORS="$NES6502_VECTORS"

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      - name: Stage build for manual testing
        run: rm -rf /tmp/neasant-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/neasant-build

      - name: Test
        env:
          NEASANT_REQUIRE_NES6502_VECTORS: '1'
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-x64-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-results
          path: ci-output/

  # ── Windows x64 (WINDOWS-BVDA56O) ────────────────────────────────────────────
  windows-x64:
    name: Windows x64 (WINDOWS-BVDA56O)
    runs-on: [self-hosted, X64, Windows, windows_x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage nes6502 vectors
        shell: powershell
        run: |
          $VECS = "$($env:USERPROFILE -replace '\\','/')/neasant-65x02-vectors"
          if (-not (Test-Path "$VECS/nes6502/v1")) {
            if (Test-Path $VECS) { Remove-Item $VECS -Recurse -Force }
            git clone --depth 1 --filter=blob:none --sparse https://github.com/SingleStepTests/65x02.git $VECS
            git -C $VECS sparse-checkout set nes6502/v1
          }
          "NES6502_VECTORS=$VECS/nes6502/v1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clean CMake cache (preserve downloads)
        shell: powershell
        run: |
          if (Test-Path C:\neasant-ci-build\CMakeCache.txt) {
            Remove-Item C:\neasant-ci-build\CMakeCache.txt -Force
          }
          if (Test-Path C:\neasant-ci-build\CMakeFiles) {
            Remove-Item C:\neasant-ci-build\CMakeFiles -Recurse -Force
          }
          if (Test-Path C:\neasant-ci-build\_deps) {
            Get-ChildItem C:\neasant-ci-build\_deps -Filter "*-subbuild" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\neasant-ci-build `
            -G "Visual Studio 17 2022" -A x64 `
            -DNEASANT_NES6502_VECTORS="$env:NES6502_VECTORS"

      - name: Build
        shell: powershell
        run: cmake --build C:\neasant-ci-build --config Release --parallel

      - name: Test
        shell: powershell
        env:
          NEASANT_REQUIRE_NES6502_VECTORS: '1'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ci-output" | Out-Null
          $results = "$env:GITHUB_WORKSPACE\ci-output\windows-x64-results.txt"
          cmd /c "ctest --test-dir C:\neasant-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # Tee-Object does not update $LASTEXITCODE; propagate the ctest exit code
          # explicitly so a test failure fails the step instead of reporting green.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-results
          path: ci-output/

  # ── macOS ARM64 (ericmacmini) ────────────────────────────────────────────────
  # The three ARM64 jobs share one physical host (the Mac and its linmac/winmac
  # VMs), so they are chained with needs: to run one at a time.
  macos-arm64:
    name: macOS ARM64 (ericmacmini)
    runs-on: [self-hosted, macOS, ARM64, ericmacmini]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Stage nes6502 vectors
        run: |
          set -eo pipefail
          VECS="$HOME/neasant-65x02-vectors"
          if [ ! -d "$VECS/nes6502/v1" ]; then
            rm -rf "$VECS"
            git clone --depth 1 --filter=blob:none --sparse https://github.com/SingleStepTests/65x02.git "$VECS"
            git -C "$VECS" sparse-checkout set nes6502/v1
          fi
          echo "NES6502_VECTORS=$VECS/nes6502/v1" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNEASANT_NES6502_VECTORS="$NES6502_VECTORS"

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      - name: Stage build for manual testing
        run: rm -rf /tmp/neasant-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/neasant-build

      - name: Test
        env:
          NEASANT_REQUIRE_NES6502_VECTORS: '1'
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/macos-arm64-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-results
          path: ci-output/

  # ── Linux ARM64 (linmac-arm64 VM) ────────────────────────────────────────────
  linux-arm64:
    name: Linux ARM64 (linmac-arm64)
    runs-on: [self-hosted, Linux, ARM64, linmac-arm64]
    needs: macos-arm64
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Stage nes6502 vectors
        run: |
          set -eo pipefail
          VECS="$HOME/neasant-65x02-vectors"
          if [ ! -d "$VECS/nes6502/v1" ]; then
            rm -rf "$VECS"
            git clone --depth 1 --filter=blob:none --sparse https://github.com/SingleStepTests/65x02.git "$VECS"
            git -C "$VECS" sparse-checkout set nes6502/v1
          fi
          echo "NES6502_VECTORS=$VECS/nes6502/v1" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNEASANT_NES6502_VECTORS="$NES6502_VECTORS"

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      - name: Stage build for manual testing
        run: rm -rf /tmp/neasant-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/neasant-build

      - name: Test
        env:
          NEASANT_REQUIRE_NES6502_VECTORS: '1'
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-arm64-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-results
          path: ci-output/

  # ── Windows ARM64 (winmacarm64 VM) ───────────────────────────────────────────
  windows-arm64:
    name: Windows ARM64 (WINMACARM64)
    runs-on: [self-hosted, ARM64, Windows, winmacarm64]
    needs: linux-arm64
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage nes6502 vectors
        shell: powershell
        run: |
          $VECS = "$($env:USERPROFILE -replace '\\','/')/neasant-65x02-vectors"
          if (-not (Test-Path "$VECS/nes6502/v1")) {
            if (Test-Path $VECS) { Remove-Item $VECS -Recurse -Force }
            git clone --depth 1 --filter=blob:none --sparse https://github.com/SingleStepTests/65x02.git $VECS
            git -C $VECS sparse-checkout set nes6502/v1
          }
          "NES6502_VECTORS=$VECS/nes6502/v1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clean CMake cache (preserve downloads)
        shell: powershell
        run: |
          if (Test-Path C:\neasant-ci-build\CMakeCache.txt) {
            Remove-Item C:\neasant-ci-build\CMakeCache.txt -Force
          }
          if (Test-Path C:\neasant-ci-build\CMakeFiles) {
            Remove-Item C:\neasant-ci-build\CMakeFiles -Recurse -Force
          }
          if (Test-Path C:\neasant-ci-build\_deps) {
            Get-ChildItem C:\neasant-ci-build\_deps -Filter "*-subbuild" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\neasant-ci-build `
            -G "Visual Studio 17 2022" -A ARM64 `
            -DNEASANT_NES6502_VECTORS="$env:NES6502_VECTORS"

      - name: Build
        shell: powershell
        run: cmake --build C:\neasant-ci-build --config Release --parallel

      - name: Test
        shell: powershell
        env:
          NEASANT_REQUIRE_NES6502_VECTORS: '1'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ci-output" | Out-Null
          $results = "$env:GITHUB_WORKSPACE\ci-output\windows-arm64-results.txt"
          cmd /c "ctest --test-dir C:\neasant-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-results
          path: ci-output/
